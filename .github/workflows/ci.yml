name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent:
    name: agent (pytest + 15-check e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install kit (public repo) + agent deps
        working-directory: agent
        run: |
          pip install "git+https://github.com/harshsinghhh120-bot/tv-agent-quickstart.git"
          grep -v '^\-e ' requirements.txt > /tmp/reqs.txt
          pip install -r /tmp/reqs.txt
          pip install pytest
      - name: Unit tests
        working-directory: agent
        run: python3 -m pytest -q
      - name: E2E demo mode (spawns its own server, 15 checks)
        working-directory: agent
        run: python3 e2e_demo_check.py

  client:
    name: client (tsc + jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install
        working-directory: client
        run: npm ci
      - name: Typecheck
        working-directory: client
        run: npm run typecheck
      - name: Unit tests (jest)
        working-directory: client
        run: npm test
