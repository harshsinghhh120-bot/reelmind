// ReelMind remote bridge — Android library module.
//
// Included into the ReelMind app by plugins/withReelMindNative.js
// (settings.gradle: include ':reelmind-remote').
//
// No buildscript block on purpose: AGP/Kotlin/plugin versions are inherited
// from the root project (Expo template), which keeps the composite build
// conflict-free. `react-android` is versionless by design — the
// react-native gradle plugin aligns it to the react-native version in
// node_modules.
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.reelmind.remote'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation "com.facebook.react:react-android"
}
