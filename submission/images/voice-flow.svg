<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="DejaVu Sans, sans-serif">
  <rect width="1920" height="1080" fill="#0B0E14"/>

  <text x="80" y="88" font-size="44" font-weight="bold" fill="#F2F5FA">The voice path</text>
  <text x="80" y="128" font-size="24" fill="#9AA7BD">"Alexa, ask ReelMind — what is a black hole?" → a structured answer card on the TV</text>

  <!-- Step boxes -->
  <g>
    <!-- 1 -->
    <rect x="100" y="330" width="260" height="400" rx="16" fill="#1A2130" stroke="#2A3550" stroke-width="2"/>
    <circle cx="230" cy="290" r="30" fill="#FFB13D"/>
    <text x="230" y="300" font-size="28" font-weight="bold" fill="#0B0E14" text-anchor="middle">1</text>
    <text x="230" y="390" font-size="24" font-weight="bold" fill="#FFB13D" text-anchor="middle">Say it</text>
    <text x="230" y="440" font-size="18" fill="#F2F5FA" text-anchor="middle">mic on the Alexa</text>
    <text x="230" y="464" font-size="18" fill="#F2F5FA" text-anchor="middle">remote — or hands-free</text>
    <text x="230" y="488" font-size="18" fill="#F2F5FA" text-anchor="middle">across the room</text>
    <text x="230" y="530" font-size="16" fill="#9AA7BD" text-anchor="middle">near-field (remote) ·</text>
    <text x="230" y="552" font-size="16" fill="#9AA7BD" text-anchor="middle">far-field (Echo / Cube,</text>
    <text x="230" y="574" font-size="16" fill="#9AA7BD" text-anchor="middle">one console toggle)</text>

    <!-- 2 -->
    <rect x="410" y="330" width="260" height="400" rx="16" fill="#1A2130" stroke="#2A3550" stroke-width="2"/>
    <circle cx="540" cy="290" r="30" fill="#FFB13D"/>
    <text x="540" y="300" font-size="28" font-weight="bold" fill="#0B0E14" text-anchor="middle">2</text>
    <text x="540" y="390" font-size="24" font-weight="bold" fill="#FFB13D" text-anchor="middle">Fire OS routes it</text>
    <text x="540" y="440" font-size="18" fill="#F2F5FA" text-anchor="middle">custom voice intent</text>
    <text x="540" y="464" font-size="18" fill="#F2F5FA" text-anchor="middle">— exact action match</text>
    <text x="540" y="506" font-size="16" fill="#9AA7BD" text-anchor="middle">not a content search,</text>
    <text x="540" y="528" font-size="16" fill="#9AA7BD" text-anchor="middle">not a skill, no Lambda:</text>
    <text x="540" y="550" font-size="16" fill="#9AA7BD" text-anchor="middle">registered in the Fire OS</text>
    <text x="540" y="572" font-size="16" fill="#9AA7BD" text-anchor="middle">Developer Options console</text>

    <!-- 3 -->
    <rect x="720" y="330" width="260" height="400" rx="16" fill="#1A2130" stroke="#2A3550" stroke-width="2"/>
    <circle cx="850" cy="290" r="30" fill="#FFB13D"/>
    <text x="850" y="300" font-size="28" font-weight="bold" fill="#0B0E14" text-anchor="middle">3</text>
    <text x="850" y="390" font-size="24" font-weight="bold" fill="#FFB13D" text-anchor="middle">Intent fires</text>
    <text x="850" y="440" font-size="18" fill="#F2F5FA" text-anchor="middle">com.reelmind.app.ASK</text>
    <text x="850" y="464" font-size="18" fill="#F2F5FA" text-anchor="middle">+ the spoken query</text>
    <text x="850" y="506" font-size="16" fill="#9AA7BD" text-anchor="middle">relaunches .MainActivity</text>
    <text x="850" y="528" font-size="16" fill="#9AA7BD" text-anchor="middle">with the text as intent</text>
    <text x="850" y="550" font-size="16" fill="#9AA7BD" text-anchor="middle">data / extra</text>

    <!-- 4 -->
    <rect x="1030" y="330" width="260" height="400" rx="16" fill="#1A2130" stroke="#2A3550" stroke-width="2"/>
    <circle cx="1160" cy="290" r="30" fill="#FFB13D"/>
    <text x="1160" y="300" font-size="28" font-weight="bold" fill="#0B0E14" text-anchor="middle">4</text>
    <text x="1160" y="390" font-size="24" font-weight="bold" fill="#FFB13D" text-anchor="middle">Kotlin bridge</text>
    <text x="1160" y="440" font-size="18" fill="#F2F5FA" text-anchor="middle">consumeVoiceQuery()</text>
    <text x="1160" y="482" font-size="16" fill="#9AA7BD" text-anchor="middle">reads the intent, clears</text>
    <text x="1160" y="504" font-size="16" fill="#9AA7BD" text-anchor="middle">it (no double-fires), JS</text>
    <text x="1160" y="526" font-size="16" fill="#9AA7BD" text-anchor="middle">submits the question to</text>
    <text x="1160" y="548" font-size="16" fill="#9AA7BD" text-anchor="middle">the agent immediately</text>

    <!-- 5 -->
    <rect x="1340" y="330" width="260" height="400" rx="16" fill="#1A2130" stroke="#2A3550" stroke-width="2"/>
    <circle cx="1470" cy="290" r="30" fill="#FFB13D"/>
    <text x="1470" y="300" font-size="28" font-weight="bold" fill="#0B0E14" text-anchor="middle">5</text>
    <text x="1470" y="390" font-size="24" font-weight="bold" fill="#FFB13D" text-anchor="middle">Agent answers</text>
    <text x="1470" y="440" font-size="18" fill="#F2F5FA" text-anchor="middle">POST /chat</text>
    <text x="1470" y="482" font-size="16" fill="#9AA7BD" text-anchor="middle">Strands + Bedrock Sonnet</text>
    <text x="1470" y="504" font-size="16" fill="#9AA7BD" text-anchor="middle">consults YOUR progress</text>
    <text x="1470" y="526" font-size="16" fill="#9AA7BD" text-anchor="middle">tool before answering</text>
    <text x="1470" y="548" font-size="16" fill="#9AA7BD" text-anchor="middle">(spoiler-safe by default)</text>

    <!-- 6 -->
    <rect x="1650" y="330" width="260" height="400" rx="16" fill="#1A2130" stroke="#4CD97B" stroke-width="2"/>
    <circle cx="1780" cy="290" r="30" fill="#4CD97B"/>
    <text x="1780" y="300" font-size="28" font-weight="bold" fill="#0B0E14" text-anchor="middle">6</text>
    <text x="1780" y="390" font-size="24" font-weight="bold" fill="#4CD97B" text-anchor="middle">Card on screen</text>
    <text x="1780" y="440" font-size="18" fill="#F2F5FA" text-anchor="middle">CompanionReply JSON</text>
    <text x="1780" y="482" font-size="16" fill="#9AA7BD" text-anchor="middle">renders as a 10-foot card</text>
    <text x="1780" y="504" font-size="16" fill="#9AA7BD" text-anchor="middle">— explain in kid / deep</text>
    <text x="1780" y="526" font-size="16" fill="#9AA7BD" text-anchor="middle">mode, quiz, prompts…</text>
  </g>

  <!-- Arrows between steps -->
  <g stroke="#FFB13D" stroke-width="4" fill="#FFB13D">
    <line x1="362" y1="530" x2="406" y2="530"/><polygon points="406,530 388,520 388,540"/>
    <line x1="672" y1="530" x2="716" y2="530"/><polygon points="716,530 698,520 698,540"/>
    <line x1="982" y1="530" x2="1026" y2="530"/><polygon points="1026,530 1008,520 1008,540"/>
    <line x1="1292" y1="530" x2="1336" y2="530"/><polygon points="1336,530 1318,520 1318,540"/>
    <line x1="1602" y1="530" x2="1646" y2="530"/><polygon points="1646,530 1628,520 1628,540"/>
  </g>

  <!-- Bottom strip -->
  <rect x="100" y="800" width="1810" height="160" rx="16" fill="#141926" stroke="#2A3550" stroke-width="2"/>
  <text x="132" y="858" font-size="24" font-weight="bold" fill="#FFB13D">Why it works end-to-end</text>
  <text x="132" y="900" font-size="21" fill="#F2F5FA">No new cloud service sits in the voice path: intent → app → your existing agent. The agent is the only AWS component (Bedrock),</text>
  <text x="132" y="932" font-size="21" fill="#F2F5FA">and in demo mode even that is optional — the whole flow runs offline with canned answers over the same schema.</text>
</svg>
